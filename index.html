<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Darang Studio CRM</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --card-bg: #171717;
            --accent-gold: #d4af37;
            --text-main: #f5f5f7;
            --text-sub: #a1a1a6;
            --border-color: #262626;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent-gold);
            margin: 0 0 6px 0;
        }

        .header p {
            color: var(--text-sub);
            font-size: 13px;
            margin: 0;
        }

        .controls {
            width: 100%;
            max-width: 480px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
        }

        select, button {
            background: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }

        select {
            flex: 1;
        }

        button.btn-fetch {
            background: var(--accent-gold);
            color: #000;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        button.btn-fetch:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .lead-card {
            width: 100%;
            max-width: 480px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
            margin-top: 16px;
        }

        #leadList {
            width: 100%;
            max-width: 480px;
        }

        .low-priority {
            opacity: 0.75;
        }

        .muted {
            color: var(--text-sub);
            font-style: italic;
        }

        .action-btn.disabled {
            background: #1f1f1f;
            color: var(--text-sub);
            pointer-events: none;
        }

        .company-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .region-badge {
            display: inline-block;
            background: #262626;
            color: var(--accent-gold);
            font-size: 11px;
            padding: 4px 8px;
            border-radius: 4px;
            margin-bottom: 16px;
            text-transform: uppercase;
        }

        .info-group {
            margin-bottom: 12px;
        }

        .info-label {
            font-size: 11px;
            color: var(--text-sub);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 2px;
        }

        .info-value {
            font-size: 14px;
            color: var(--text-main);
            word-break: break-all;
        }

        .pitch-box {
            background: #0d0d0d;
            border: 1px dashed var(--accent-gold);
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            line-height: 1.5;
            color: #e5e5e5;
            margin-top: 16px;
        }

        .actions {
            margin-top: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .action-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            text-align: center;
        }

        .btn-wa {
            background: #25d366;
            color: #000;
        }

        .btn-link {
            background: #262626;
            color: var(--text-main);
        }

        #status-msg {
            margin-top: 12px;
            font-size: 13px;
            color: var(--text-sub);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Darang Lead Engine</h1>
        <p>Live Discovery & Custom Pitching</p>
    </div>

    <div class="controls">
        <select id="regionSelect">
            <option value="all">All Regions</option>
            <option value="Houston TX">Houston TX</option>
            <option value="Dubai UAE">Dubai UAE</option>
            <option value="Riyadh KSA">Riyadh KSA</option>
        </select>
        <button class="btn-fetch" id="fetchBtn" onclick="fetchLiveLead()">⚡ FETCH</button>
    </div>

    <div id="status-msg">Tap FETCH to pull up to 5 new leads with real website audits.</div>

    <div id="leadList"></div>

    <template id="leadTemplate">
        <div class="lead-card">
            <div class="company-title" data-f="company_name">-</div>
            <div class="region-badge" data-f="region">-</div>

            <div class="info-group">
                <div class="info-label">Website</div>
                <div class="info-value" data-f="website">-</div>
            </div>

            <div class="info-group">
                <div class="info-label">Contact Email</div>
                <div class="info-value" data-f="email">-</div>
            </div>

            <div class="info-group">
                <div class="info-label">Phone / WhatsApp</div>
                <div class="info-value" data-f="phone_whatsapp">-</div>
            </div>

            <div class="info-group">
                <div class="info-label">Audit Finding</div>
                <div class="info-value" data-f="website_issue">-</div>
            </div>

            <div class="info-group">
                <div class="info-label">Package</div>
                <div class="info-value" data-f="target_package">-</div>
            </div>

            <div class="pitch-box" data-f="pitch_text">-</div>

            <div class="actions">
                <a href="#" target="_blank" rel="noopener" class="action-btn btn-wa" data-a="wa">WhatsApp Lead</a>
                <a href="#" target="_blank" rel="noopener" class="action-btn btn-link" data-a="site">Visit Website</a>
            </div>
        </div>
    </template>

    <script>
        const BACKEND_API_URL = "/api/fetch-leads";

        function renderLead(lead) {
            const node = document.getElementById('leadTemplate').content.firstElementChild.cloneNode(true);
            if (lead.status === 'Low priority') node.classList.add('low-priority');

            node.querySelectorAll('[data-f]').forEach(el => {
                const key = el.dataset.f;
                const val = lead[key];
                if (val) {
                    el.textContent = val;
                } else {
                    el.textContent = key === 'email' ? 'No email found on their site'
                        : key === 'phone_whatsapp' ? 'No phone found on their site' : '-';
                    el.classList.add('muted');
                }
            });

            const wa = node.querySelector('[data-a="wa"]');
            const digits = (lead.phone_whatsapp || '').replace(/\D/g, '');
            if (digits.length >= 9) {
                wa.href = `https://wa.me/${digits}?text=${encodeURIComponent(lead.pitch_text)}`;
            } else {
                wa.textContent = 'No WhatsApp';
                wa.classList.add('disabled');
                wa.removeAttribute('href');
            }
            node.querySelector('[data-a="site"]').href = lead.source_link || `https://${lead.website}`;
            return node;
        }

        async function fetchLiveLead() {
            const btn = document.getElementById('fetchBtn');
            const status = document.getElementById('status-msg');
            const list = document.getElementById('leadList');
            const region = document.getElementById('regionSelect').value;

            btn.disabled = true;
            status.innerText = "Searching and auditing live company websites (10-20s)...";

            try {
                const response = await fetch(BACKEND_API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ regionFilter: region })
                });

                const data = await response.json();

                if (!data.success) {
                    status.innerText = data.message || "No new leads found. Try again.";
                    return;
                }

                list.innerHTML = '';
                data.leads.forEach(lead => list.appendChild(renderLead(lead)));
                const strong = data.leads.filter(l => l.status !== 'Low priority').length;
                status.innerText = `${data.leads.length} leads saved to Supabase (${strong} with real website issues).`;
            } catch (err) {
                console.error(err);
                status.innerText = "Error connecting to backend server.";
            } finally {
                btn.disabled = false;
            }
        }
    </script>
</body>
</html>
